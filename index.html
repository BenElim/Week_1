<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-shell">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">SW</span>
        <span class="brand-name">SpendWise</span>
      </div>

      <nav class="sidebar-nav" aria-label="Primary">
        <ul>
          <li><a href="#" class="nav-link is-active" aria-current="page">Dashboard</a></li>
          <li><a href="#" class="nav-link">Expenses</a></li>
          <li><a href="#" class="nav-link">Reports</a></li>
          <li><a href="#" class="nav-link">Budgets</a></li>
          <li><a href="#" class="nav-link">Settings</a></li>
        </ul>
      </nav>

      <div class="sidebar-user">
        <span class="user-avatar">AK</span>
        <div class="user-meta">
          <span class="user-name">Amina Kimani</span>
          <span class="user-plan">Personal plan</span>
        </div>
      </div>
    </aside>

    <!-- ===================== HEADER ===================== -->
    <header class="dashboard-header">
      <div class="header-title">
        <h1>Dashboard overview</h1>
        <p>Here's where your money went this month.</p>
      </div>

      <div class="header-actions">
        <span class="date-range">Sep 1 – Sep 15, 2026</span>
        <span class="user-avatar user-avatar--header">AK</span>
      </div>
    </header>

    <!-- ===================== MAIN ===================== -->
    <main class="dashboard-main">

      <section class="summary-bar" aria-label="Monthly summary">
        <div class="summary-item">
          <span class="summary-label">Total spent this month</span>
          <span class="summary-value">$2,155.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Monthly budget</span>
          <span class="summary-value">$2,320.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Remaining</span>
          <span class="summary-value summary-value--positive">$165.00</span>
        </div>
      </section>

      <section class="cards-grid" aria-label="Spending by category">

        <button type="button" class="card" data-status="under">
          <div class="card-top">
            <span class="card-category">Food</span>
            <span class="card-status">On track</span>
          </div>
          <span class="card-amount">$420<small>.00</small></span>
          <span class="card-budget">of $500.00 budget</span>
          <div class="card-progress">
            <div class="card-progress-fill" style="width: 84%;"></div>
          </div>
        </button>

        <button type="button" class="card" data-status="over">
          <div class="card-top">
            <span class="card-category">Transport</span>
            <span class="card-status">Over budget</span>
          </div>
          <span class="card-amount">$180<small>.00</small></span>
          <span class="card-budget">of $150.00 budget</span>
          <div class="card-progress">
            <div class="card-progress-fill" style="width: 100%;"></div>
          </div>
        </button>

        <button type="button" class="card" data-status="under">
          <div class="card-top">
            <span class="card-category">Rent</span>
            <span class="card-status">At limit</span>
          </div>
          <span class="card-amount">$950<small>.00</small></span>
          <span class="card-budget">of $950.00 budget</span>
          <div class="card-progress">
            <div class="card-progress-fill" style="width: 100%;"></div>
          </div>
        </button>

        <button type="button" class="card" data-status="under">
          <div class="card-top">
            <span class="card-category">Entertainment</span>
            <span class="card-status">On track</span>
          </div>
          <span class="card-amount">$95<small>.00</small></span>
          <span class="card-budget">of $120.00 budget</span>
          <div class="card-progress">
            <div class="card-progress-fill" style="width: 79%;"></div>
          </div>
        </button>

        <button type="button" class="card" data-status="under">
          <div class="card-top">
            <span class="card-category">Savings</span>
            <span class="card-status">On track</span>
          </div>
          <span class="card-amount">$300<small>.00</small></span>
          <span class="card-budget">of $400.00 goal</span>
          <div class="card-progress">
            <div class="card-progress-fill" style="width: 75%;"></div>
          </div>
        </button>

        <button type="button" class="card" data-status="over">
          <div class="card-top">
            <span class="card-category">Utilities</span>
            <span class="card-status">Over budget</span>
          </div>
          <span class="card-amount">$210<small>.00</small></span>
          <span class="card-budget">of $200.00 budget</span>
          <div class="card-progress">
            <div class="card-progress-fill" style="width: 100%;"></div>
          </div>
        </button>

      </section>

    </main>

  </div>

  <script src="script.js" defer></script>

</body>
</html>
