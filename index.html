<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise — Dashboard</title>
  <meta name="description" content="SpendWise: a simple budgeting dashboard to track monthly spending by category.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b4b43'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Georgia,serif' font-weight='600' text-anchor='middle' fill='%23e2a53d'%3ESW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-shell">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">SW</span>
        <span class="brand-name">SpendWise</span>
      </div>

      <nav class="sidebar-nav" aria-label="Primary">
        <ul>
          <li><a href="#" class="nav-link is-active" aria-current="page">Dashboard</a></li>
          <li><a href="#" class="nav-link">Expenses</a></li>
          <li><a href="#" class="nav-link">Reports</a></li>
          <li><a href="#" class="nav-link">Budgets</a></li>
          <li><a href="#" class="nav-link">Settings</a></li>
        </ul>
      </nav>

      <div class="sidebar-user">
        <span class="user-avatar">AK</span>
        <div class="user-meta">
          <span class="user-name">Elim Benjamin</span>
          <span class="user-plan">Personal plan</span>
        </div>
      </div>
    </aside>

    <!-- ===================== HEADER ===================== -->
    <header class="dashboard-header">
      <div class="header-title">
        <h1>Dashboard overview</h1>
        <p>Your money, clearly mapped.</p>
      </div>

      <div class="header-actions">
        <span class="date-range">Sep 1 – Sep 15, 2026</span>
        <span class="user-avatar user-avatar--header">AK</span>
      </div>
    </header>

    <!-- ===================== MAIN ===================== -->
    <main class="dashboard-main">

      <section class="summary-bar" aria-label="Monthly summary">
        <div class="summary-item">
          <span class="summary-label">Total spent this month</span>
          <span class="summary-value" id="total-spent-value">$0.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Monthly budget</span>
          <span class="summary-value" id="monthly-budget-value">$0.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Remaining</span>
          <span class="summary-value" id="remaining-value">$0.00</span>
        </div>
      </section>

      <div id="status-banner" class="status-banner" role="status"></div>

      <section class="panel" aria-label="Update monthly budget">
        <h2>Monthly Budget</h2>
        <form id="budget-form" class="inline-form">
          <div class="form-field">
            <label for="budget-input">Budget amount ($)</label>
            <input type="number" id="budget-input" min="0" step="0.01" value="2320.00" required>
          </div>
          <button type="submit">Update Budget</button>
        </form>
      </section>

      <section class="panel" aria-label="Add a new expense">
        <h2>Add Expense</h2>
        <form id="expense-form" class="inline-form">
          <div class="form-field">
            <label for="expense-name-input">Expense name</label>
            <input type="text" id="expense-name-input" placeholder="e.g. Groceries" required>
          </div>
          <div class="form-field">
            <label for="expense-amount-input">Amount ($)</label>
            <input type="number" id="expense-amount-input" min="0" step="0.01" placeholder="0.00" required>
          </div>
          <div class="form-field">
            <label for="expense-category-select">Category</label>
            <select id="expense-category-select">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Rent">Rent</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Savings">Savings</option>
              <option value="Utilities">Utilities</option>
              <option value="__new__">Other (new category)</option>
            </select>
          </div>
          <div class="form-field" id="new-category-field" hidden>
            <label for="new-category-name-input">New category name</label>
            <input type="text" id="new-category-name-input" placeholder="e.g. Subscriptions">
          </div>
          <div class="form-field" id="new-category-budget-field" hidden>
            <label for="new-category-budget-input">Budget for this category ($)</label>
            <input type="number" id="new-category-budget-input" min="0" step="0.01" placeholder="0.00">
          </div>
          <button type="submit">Add Expense</button>
        </form>
      </section>

      <section class="panel alerts-panel" id="alerts-panel" hidden aria-label="Budget alerts">
        <h2>Over-Budget Alerts</h2>
        <ul id="alerts-list"></ul>
      </section>

      <section class="cards-grid" id="cards-grid" aria-label="Spending by category">
        <!-- Cards are rendered here by script.js, one per category in the
             expenseCategories array. Click a card to select/highlight it. -->
      </section>

    </main>

  </div>

  <script src="script.js" defer></script>

</body>
</html>
